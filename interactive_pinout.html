  "shared_pins": [
    { "type": "GND", "uaefi_pin": "A3,A4,C8", "uaefi_pin_en": "A3,A4,C8", "name": "Силовая земля (также выведена на клемму J28)", "name_en": "Power/Chassis GND ground (also on terminal J28)", "pins": [3, 51, 53, 61, 80, 84, 118] },
    { "type": "GNDA", "uaefi_pin": "C11,C12,C13,D11,D12", "uaefi_pin_en": "C11,C12,C13,D11,D12", "name": "Аналоговая земля", "name_en": "Analog GND / sensor ground", "pins": [17, 20, 35, 36, 73, 78, 82, 83, 85, 86, 87, 88, 89] },
    { "type": "+5VP", "uaefi_pin": "C1,C2,D3,D4", "uaefi_pin_en": "C1,C2,D3,D4", "name": "Питание датчиков +5 В", "name_en": "+5v sensor supply", "pins": [32, 33, 90, 91, 93, 94, 95, 96, 97] },
    { "type": "+12V", "uaefi_pin": "A8,E1", "uaefi_pin_en": "A8,E1", "name": "Питание +12 В", "name_en": "+12v from main relay", "pins": [44, 45, 63, 117] },
    { "type": "OUT_DC1-", "uaefi_pin": "A1", "uaefi_pin_en": "A1", "name": "Драйвер DC-мотора 1 (ETB), выход −, мост TLE9201SG до 6 А", "name_en": "DC1- output (usually electronic throttle body), TLE9201SG up to 6 A", "pins": [64, 65] },
    { "type": "OUT_DC1+", "uaefi_pin": "A5", "uaefi_pin_en": "A5", "name": "Драйвер DC-мотора 1 (ETB), выход +, мост TLE9201SG до 6 А", "name_en": "DC1+ output (usually electronic throttle body), TLE9201SG up to 6 A", "pins": [66, 67] }
  ]
};

    // --- 0. ЛОКАЛИЗАЦИЯ ---
    const I18N = {
        ru: {
            docTitle: "Интерактивная распиновка ЭБУ (121 Pin) - uaEFI",
            title: "Интерактивная схема разъема ЭБУ (121 Pin)",
            subtitle: "Карта соединений с платой uaEFI.",
            search: "Поиск по пину, метке...",
            thBosch: "Пин 121 (Bosch)",
            thUaefi: "Пин uaEFI",
            thLabel: "Метка со схемы",
            thName: "Назначение (Имя)",
            notConnected: "Не подключен",
            dash: "—",
            tipTitle: p => `Пин №${p} (Bosch 121)`,
            tipUaefi: "uaEFI",
            tipLabel: "Метка",
            tipName: "Назначение"
        },
        en: {
            docTitle: "Interactive ECU Pinout (121 Pin) - uaEFI",
            title: "Interactive ECU Connector Pinout (121 Pin)",
            subtitle: "Connection map to the uaEFI board.",
            search: "Search by pin or label...",
            thBosch: "Pin 121 (Bosch)",
            thUaefi: "uaEFI pin",
            thLabel: "Schematic label",
            thName: "Function",
            notConnected: "Not connected",
            dash: "—",
            tipTitle: p => `Pin #${p} (Bosch 121)`,
            tipUaefi: "uaEFI",
            tipLabel: "Label",
            tipName: "Function"
        }
    };

    const LANG_KEY = "uaefi_pinout_lang";

    function detectLang() {
        try {
            const saved = localStorage.getItem(LANG_KEY);
            if (saved === "ru" || saved === "en") return saved;
        } catch (e) { /* приватный режим / доступ к хранилищу закрыт */ }
        const nav = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
        return String(nav).toLowerCase().startsWith("ru") ? "ru" : "en";
    }

    let lang = detectLang();
    const t = () => I18N[lang];

    // --- 1. ПОДГОТОВКА ДАННЫХ ---
    const pinDatabase = {};
    const pinToGroup = {};

    // Инициализация: пин не подключён
    for (let i = 1; i <= 121; i++) {
        pinDatabase[i] = { uaefi: null, label: "-", name: null, connected: false };
    }

    // Заполнение маппинга
    pinData.pin_mapping.forEach(item => {
        if(item.bosch_pin >= 1 && item.bosch_pin <= 121) {
            pinDatabase[item.bosch_pin] = {
                uaefi: { ru: item.uaefi_pin, en: item.uaefi_pin_en || item.uaefi_pin },
                label: item.label,
                name:  { ru: item.name || item.label, en: item.name_en || item.name || item.label },
                connected: true
            };
        }
    });

    // Заполнение групп
    pinData.shared_pins.forEach(group => {
        group.pins.forEach(p => {
            if(p >= 1 && p <= 121) {
                pinToGroup[p] = group.type;
                if(!pinDatabase[p].connected) {
                    pinDatabase[p] = {
                        uaefi: { ru: group.uaefi_pin, en: group.uaefi_pin_en || group.uaefi_pin },
                        label: group.type,
                        name:  { ru: group.name, en: group.name_en || group.name },
                        connected: true
                    };
                }
            }
        });
    });

    // Значения пина в текущем языке
    function pinView(p) {
        const d = pinDatabase[p];
        if (!d.connected) return { uaefi: t().dash, label: "-", name: t().notConnected };
        return { uaefi: d.uaefi[lang], label: d.label, name: d.name[lang] };
    }

    // --- 2. РЕНДЕРИНГ (ГЕОМЕТРИЯ КАК В ОРИГИНАЛЕ) ---
    const pinsGeometry = {};
    // (Генерация геометрии оставлена без изменений)
    const initGeom = () => {
        pinsGeometry[4] = { cx: 50, cy: 60, type: "large", label: "top" };
        pinsGeometry[5] = { cx: 110, cy: 60, type: "large", label: "top" };
        pinsGeometry[3] = { cx: 80, cy: 135, type: "large", label: "right" };
        pinsGeometry[1] = { cx: 50, cy: 210, type: "large", label: "bottom" };
        pinsGeometry[2] = { cx: 110, cy: 210, type: "large", label: "bottom" };
        let idx = 0; for(let p = 24; p >= 6; p--)  { pinsGeometry[p] = { cx: 160 + idx*20, cy: 60, type: "small", label: (p==24||p==6)?"top":"none" }; idx++; }
        idx = 0;     for(let p = 43; p >= 25; p--) { pinsGeometry[p] = { cx: 160 + idx*20, cy: 100, type: "small", label: (p==43||p==25)?"top":"none" }; idx++; }
        idx = 0;     for(let p = 62; p >= 44; p--) { pinsGeometry[p] = { cx: 160 + idx*20, cy: 170, type: "small", label: (p==62||p==44)?"bottom":"none" }; idx++; }
        idx = 0;     for(let p = 81; p >= 63; p--) { pinsGeometry[p] = { cx: 160 + idx*20, cy: 210, type: "small", label: (p==81||p==63)?"bottom":"none" }; idx++; }
        idx = 0;     for(let p = 106; p <= 113; p++) { pinsGeometry[p] = { cx: 585 + idx*20, cy: 60, type: "small", label: (p==106||p==113)?"top":"none" }; idx++; }
        idx = 0;     for(let p = 98; p <= 105; p++)  { pinsGeometry[p] = { cx: 585 + idx*20, cy: 100, type: "small", label: (p==98||p==105)?"top":"none" }; idx++; }
        idx = 0;     for(let p = 90; p <= 97; p++)   { pinsGeometry[p] = { cx: 585 + idx*20, cy: 170, type: "small", label: (p==90||p==97)?"bottom":"none" }; idx++; }
        idx = 0;     for(let p = 82; p <= 89; p++)   { pinsGeometry[p] = { cx: 585 + idx*20, cy: 210, type: "small", label: (p==82||p==89)?"bottom":"none" }; idx++; }
        pinsGeometry[119] = { cx: 775, cy: 60, type: "large", label: "top" };
        pinsGeometry[120] = { cx: 815, cy: 60, type: "large", label: "none" };
        pinsGeometry[121] = { cx: 855, cy: 60, type: "large", label: "top" };
        pinsGeometry[117] = { cx: 795, cy: 135, type: "large", label: "none" };
        pinsGeometry[118] = { cx: 835, cy: 135, type: "large", label: "none" };
        pinsGeometry[114] = { cx: 775, cy: 210, type: "large", label: "bottom" };
        pinsGeometry[115] = { cx: 815, cy: 210, type: "large", label: "none" };
        pinsGeometry[116] = { cx: 855, cy: 210, type: "large", label: "bottom" };
    };
    initGeom();

    const pinsContainer = document.getElementById('pinsContainer');
    const tableBody = document.getElementById('tableBody');
    const tooltip = document.getElementById('tooltip');
    
    // Рендер SVG
    Object.keys(pinsGeometry).sort((a,b) => a-b).forEach(p => {
        const geom = pinsGeometry[p];
        const cls = `pin pin-${p}`;
        let svg = geom.type === "large" 
            ? `<rect id="pin-svg-${p}" class="${cls}" x="${geom.cx - 12}" y="${geom.cy - 8}" width="24" height="16" rx="2" data-pin="${p}" onclick="highlightPin(${p})"/>`
            : `<circle id="pin-svg-${p}" class="${cls}" cx="${geom.cx}" cy="${geom.cy}" r="6" data-pin="${p}" onclick="highlightPin(${p})"/>`;
        let lbl = '';
        if (geom.label === "top") lbl = `<text class="pin-label" x="${geom.cx}" y="${geom.cy - 14}">${p}</text>`;
        else if (geom.label === "bottom") lbl = `<text class="pin-label" x="${geom.cx}" y="${geom.cy + 22}">${p}</text>`;
        else if (geom.label === "right") lbl = `<text class="pin-label" x="${geom.cx + 18}" y="${geom.cy + 5}">${p}</text>`;
        pinsContainer.innerHTML += svg + lbl;
    });

    // Рендер таблицы
    function renderTable() {
        let rows = "";
        for (let p = 1; p <= 121; p++) {
            const d = pinView(p);
            rows += `<tr id="pin-row-${p}" onclick="highlightPin(${p})"><td><strong>${p}</strong></td><td>${d.uaefi}</td><td><span class="badge">${d.label}</span></td><td>${d.name}</td></tr>`;
        }
        tableBody.innerHTML = rows;
    }

    // --- 3. ИНТЕРАКТИВ ---
    const TIP_GAP = 15;     // отступ от курсора
    const TIP_EDGE = 8;     // минимальный зазор до края окна

    // Подсказка идёт справа от курсора, а если не помещается — слева от него.
    // Ширину меряем у левого края: иначе остаток места до правого края окна
    // сам ужимает блок переносами и ширина получается заниженной.
    function placeTooltip(e) {
        tooltip.style.left = '0px';
        const w = tooltip.offsetWidth;
        let x = e.clientX + TIP_GAP;
        if (x + w > window.innerWidth - TIP_EDGE) {
            x = e.clientX - TIP_GAP - w;
        }
        tooltip.style.left = Math.max(TIP_EDGE, x) + 'px';
        tooltip.style.top = (e.clientY + TIP_GAP) + 'px';
    }

    document.querySelectorAll('.pin').forEach(el => {
        const p = parseInt(el.getAttribute('data-pin'));
        el.addEventListener('mouseenter', (e) => {
            const data = pinView(p);
            tooltip.innerHTML = `<div class="tooltip-title">${t().tipTitle(p)}</div>${t().tipUaefi}: ${data.uaefi}<br/>${t().tipLabel}: ${data.label}<br/>${t().tipName}: ${data.name}`;
            tooltip.style.display = 'block';
            placeTooltip(e);

            // Логика групповой подсветки
            const groupName = pinToGroup[p];
            if (groupName) {
                const group = pinData.shared_pins.find(g => g.type === groupName);
                group.pins.forEach(targetP => {
                    if (targetP <= 121) {
                        document.getElementById('pin-svg-' + targetP)?.classList.add('connected-highlight');
                        document.getElementById('pin-row-' + targetP)?.classList.add('connected-row');
                    }
                });
            }
        });
        
        el.addEventListener('mousemove', placeTooltip);

        el.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
            document.querySelectorAll('.pin').forEach(el => el.classList.remove('connected-highlight'));
            document.querySelectorAll('tr').forEach(tr => tr.classList.remove('connected-row'));
        });
    });

    function highlightPin(p) {
        document.querySelectorAll('.pin').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('tr').forEach(tr => tr.classList.remove('selected-row'));
        document.getElementById('pin-svg-' + p)?.classList.add('active');
        document.getElementById('pin-row-' + p)?.classList.add('selected-row');
        document.getElementById('pin-row-' + p)?.scrollIntoView({behavior:'smooth', block:'center'});
    }

    function filterTable() {
        const val = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('#tableBody tr').forEach(tr => tr.style.display = tr.innerText.toLowerCase().includes(val) ? "" : "none");
    }

    // --- 4. ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА ---
    function applyLang() {
        const s = t();
        document.documentElement.lang = lang;
        document.title = s.docTitle;
        document.getElementById('pageTitle').textContent = s.title;
        document.getElementById('pageSubtitle').textContent = s.subtitle;
        document.getElementById('searchInput').placeholder = s.search;
        document.getElementById('thBosch').textContent = s.thBosch;
        document.getElementById('thUaefi').textContent = s.thUaefi;
        document.getElementById('thLabel').textContent = s.thLabel;
        document.getElementById('thName').textContent = s.thName;
        document.getElementById('langBtn-ru').setAttribute('aria-pressed', String(lang === 'ru'));
        document.getElementById('langBtn-en').setAttribute('aria-pressed', String(lang === 'en'));
        renderTable();
        filterTable();
    }

    function setLang(next) {
        if (next !== 'ru' && next !== 'en') return;
        lang = next;
        try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* хранилище недоступно */ }
        applyLang();
    }

    applyLang();
</script>

</body>
</html>
